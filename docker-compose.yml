version: '3.8'

services:
  app:
    build: .
    ports:
      - "7860:7860"
    environment:
      - REDIS_HOST=redis
      - PYTHONPATH=/app
    depends_on:
      - redis
    volumes:
      - .:/app
    command: python -m app.gradio_ui

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
